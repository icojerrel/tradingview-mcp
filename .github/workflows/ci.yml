name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Trading MCP end-to-end tests
        run: |
          node test/trading-paper-e2e.mjs
          node test/trading-alpaca-e2e.mjs
          node test/trading-tradovate-e2e.mjs

      - name: Install Chromium for app e2e test
        run: npx playwright install --with-deps chromium

      - name: App MCP end-to-end test
        run: node test/app-e2e.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
